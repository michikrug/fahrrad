version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (the version comment is updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # npm dependencies: three.js, vite, typescript.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR a week instead of one per package; CI decides whether it is safe to merge.
      minor-and-patch:
        update-types: [minor, patch]
